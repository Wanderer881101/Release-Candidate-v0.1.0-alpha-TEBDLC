name: RC Validation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'validation/LAST_EXECUTION.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute and persist all suites
        shell: bash
        run: |
          mkdir -p validation
          python - <<'PY'
          import json, pathlib, subprocess, sys, datetime
          tests = [
              'distribution/test_validate_records.py',
              'distribution/test_resolve_territory.py',
              'distribution/test_authentication.py',
              'distribution/test_authorize_request.py',
              'distribution/test_controlled_delivery.py',
              'distribution/test_audit_log.py',
              'distribution/test_adversarial_distribution.py',
              'distribution/test_adversarial_end_to_end.py',
          ]
          record = {
              'schema': 'tebdlc-execution-proof/0.1',
              'python': sys.version,
              'executed_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'commit': '${{ github.sha }}',
              'tests': [],
          }
          overall = True
          compile_proc = subprocess.run([sys.executable, '-m', 'compileall', '-q', 'distribution', 'territories'], capture_output=True, text=True)
          record['compile'] = {'returncode': compile_proc.returncode, 'stdout': compile_proc.stdout[-4000:], 'stderr': compile_proc.stderr[-4000:]}
          overall &= compile_proc.returncode == 0
          for path in tests:
              p = subprocess.run([sys.executable, path], capture_output=True, text=True)
              record['tests'].append({'path': path, 'returncode': p.returncode, 'stdout': p.stdout[-4000:], 'stderr': p.stderr[-4000:]})
              overall &= p.returncode == 0
          record['overall_pass'] = bool(overall)
          pathlib.Path('validation/LAST_EXECUTION.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Commit execution evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/LAST_EXECUTION.json
          git commit -m 'validation: persist RC execution evidence' || exit 0
          git push
